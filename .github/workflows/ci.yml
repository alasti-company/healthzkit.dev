name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Real-service integration
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      HEALTHZKIT_POSTGRES_URL: postgres://healthzkit:healthzkit@127.0.0.1:55432/healthzkit
      HEALTHZKIT_REDIS_URL: redis://127.0.0.1:56379
      HEALTHZKIT_RABBITMQ_URL: amqp://healthzkit:healthzkit@127.0.0.1:55672
      HEALTHZKIT_KAFKA_URL: 127.0.0.1:59092
      HEALTHZKIT_MYSQL_URL: mysql://healthzkit:healthzkit@127.0.0.1:53306/healthzkit
      HEALTHZKIT_MONGO_URL: mongodb://127.0.0.1:57017/healthzkit
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build
        run: vp run -r build
      - name: Start disposable integration services
        run: docker compose -f tools/integration/compose.yml up -d --wait --wait-timeout 180
      - name: Integration tests
        run: vp run --no-cache test:integration
      - name: Service diagnostics
        if: failure()
        run: docker compose -f tools/integration/compose.yml logs --no-color
      - name: Tear down integration services
        if: always()
        run: docker compose -f tools/integration/compose.yml down -v --remove-orphans --timeout 10

  ci:
    name: CI (Node ${{ matrix.node }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node }}
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run -r build

      - name: Security audit policy tests
        if: matrix.node == '22'
        run: vp run test:security

      - name: Dependency security audit
        if: matrix.node == '22'
        run: vp run audit:security

      # Static checks only need to run once; build/test/consumer checks run on both LTS lines.
      - name: Format
        if: matrix.node == '22'
        run: vp fmt --check

      - name: Lint
        if: matrix.node == '22'
        run: vp lint

      - name: Test
        run: vp run -r test

      - name: Packed consumer smoke
        run: vp run test:packages

  ci-required:
    # Preserve the required-check context and require the matrix plus real-service coverage.
    name: CI
    needs: [ci, integration]
    if: ${{ always() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Require all Node versions and integration tests to pass
        run: test "${{ needs.ci.result }}" = success && test "${{ needs.integration.result }}" = success
