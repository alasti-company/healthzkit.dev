name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI (Node ${{ matrix.node }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node }}
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run -r build

      # Static checks only need to run once; build/test/consumer checks run on both LTS lines.
      - name: Format
        if: matrix.node == '22'
        run: vp fmt --check

      - name: Lint
        if: matrix.node == '22'
        run: vp lint

      - name: Test
        run: vp run -r test

      - name: Packed consumer smoke
        run: vp run test:packages
