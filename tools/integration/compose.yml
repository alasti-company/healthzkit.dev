name: healthzkit-integration
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: healthzkit
      POSTGRES_PASSWORD: healthzkit
      POSTGRES_DB: healthzkit
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U healthzkit -d healthzkit"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
