apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthzkit-example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthzkit-example
  template:
    metadata:
      labels:
        app: healthzkit-example
    spec:
      # App deadline is 25s, including its 5s endpoint propagation delay.
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: healthzkit-example:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: healthzkit-example-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: healthzkit-example
spec:
  selector:
    app: healthzkit-example
  ports:
    - port: 80
      targetPort: http
