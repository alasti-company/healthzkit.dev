packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  aws-sdk: true
  # better-sqlite3 >= 13 ships prebuilt N-API binaries (prebuilds/) and sets
  # gypfile: false; forcing the build runs node-gyp for nothing and fails on CI.
  better-sqlite3: false
  esbuild: true
  # BullMQ can use msgpackr's JavaScript fallback; no optional native build needed.
  msgpackr-extract: false
  node-rdkafka: true
  protobufjs: true
  sharp: true
  sqlite3: true
  workerd: true

catalog:
  "@changesets/cli": ^3.0.3
  "@types/node": ^24.19.2
  "@typescript/native-preview": 7.0.0-dev.20260707.2
  bumpp: ^12.3.0
  node-gyp: ^12.4.0
  pg-legacy: npm:pg@8.0.0
  tsdown: ^0.23.5
  typescript: ^5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  wrangler: ^4.157.0

catalogMode: prefer
overrides:
  "vite@*": "catalog:"
  "vitest@*": 5.0.5

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
